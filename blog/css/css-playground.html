<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Playground &amp; Animation Inspector — js-tools</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      :root {
        --editor-bg: #1e1e2e;
        --preview-bg: #0f0f1b;
        --panel-border: #313244;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--preview-bg);
        color: #cdd6f4;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .app-header {
        background: #11111b;
        border-bottom: 1px solid var(--panel-border);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .app-title {
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(130deg, #ec4899 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .app-actions {
        display: flex;
        gap: 12px;
      }
      .btn {
        background: #313244;
        color: #cdd6f4;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #45475a;
      }
      .btn-primary {
        background: linear-gradient(130deg, #ec4899 0%, #89b4fa 100%);
        color: #11111b;
      }
      .btn-primary:hover {
        opacity: 0.95;
      }
      .workspace {
        flex: 1;
        display: flex;
        height: calc(100vh - 49px);
      }
      .editor-pane {
        width: 40%;
        min-width: 320px;
        background: var(--editor-bg);
        border-right: 1px solid var(--panel-border);
        display: flex;
        flex-direction: column;
      }
      .pane-header {
        background: #11111b;
        padding: 8px 16px;
        border-bottom: 1px solid var(--panel-border);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #a6adc8;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .css-textarea {
        flex: 1;
        background: transparent;
        color: #f5e0dc;
        border: none;
        padding: 16px;
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        font-size: 14px;
        line-height: 1.6;
        resize: none;
        outline: none;
      }
      .preview-pane {
        flex: 1;
        background: var(--preview-bg);
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .preview-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        position: relative;
        overflow: auto;
      }
      /* Interactive Target Element */
      .target-container {
        position: relative;
        padding: 20px;
        border: 1px dashed rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.02);
      }
      #preview-target {
        /* Standard initial style, will be overridden by user css */
        width: 140px;
        height: 140px;
        background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }
      /* Box Model Visualizer Overlays */
      .box-inspector {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .box-inspector.active {
        opacity: 1;
      }
      .inspect-box {
        position: absolute;
        border: 1px dashed #ec4899;
      }
      .inspect-margin {
        background: rgba(249, 115, 22, 0.15);
        border: 1px dashed #f97316;
      }
      .inspect-padding {
        background: rgba(34, 197, 94, 0.15);
        border: 1px dashed #22c55e;
      }
      .inspect-content {
        background: rgba(59, 130, 246, 0.2);
        border: 1px solid #3b82f6;
      }
      .inspect-label {
        position: absolute;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 3px;
        color: white;
        font-weight: 700;
        z-index: 10;
      }
      .label-margin {
        background: #f97316;
        bottom: 100%;
        left: 0;
      }
      .label-padding {
        background: #22c55e;
        top: 0;
        left: 0;
      }
      .label-content {
        background: #3b82f6;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      /* Bezier Easing Inspector */
      .bezier-panel {
        background: #11111b;
        border-top: 1px solid var(--panel-border);
        padding: 16px;
        display: flex;
        gap: 20px;
      }
      .bezier-canvas-wrapper {
        position: relative;
        width: 120px;
        height: 120px;
        background: #181825;
        border: 1px solid var(--panel-border);
        border-radius: 6px;
      }
      #bezier-canvas {
        width: 100%;
        height: 100%;
      }
      .bezier-controls {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
      }
      .bezier-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bezier-row label {
        font-size: 12px;
        width: 80px;
        color: #a6adc8;
      }
      .bezier-row input[type='range'] {
        flex: 1;
        accent-color: #ec4899;
      }
      .bezier-val {
        font-size: 12px;
        font-family: monospace;
        width: 40px;
        text-align: right;
      }
      .template-selector {
        background: #181825;
        color: #cdd6f4;
        border: 1px solid var(--panel-border);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        outline: none;
      }
      @media (max-width: 800px) {
        .workspace {
          flex-direction: column;
        }
        .editor-pane {
          width: 100%;
          height: 40%;
        }
        .preview-pane {
          height: 60%;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="app-title">
        <span>🎨 CSS Playground &amp; Animation Inspector</span>
      </div>
      <div class="app-actions">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer">
          <input type="checkbox" id="toggle-inspector" />
          <span>🔍 Inspect Box Model</span>
        </label>
        <select id="template-select" class="template-selector">
          <option value="card">Template: Card</option>
          <option value="spin">Template: Loading Spinner</option>
          <option value="bounce">Template: Bounce Animation</option>
        </select>
        <button id="btn-reset" class="btn">Reset</button>
      </div>
    </header>

    <div class="workspace">
      <!-- Editor Pane -->
      <div class="editor-pane">
        <div class="pane-header">
          <span>CSS Editor</span>
          <span style="font-size: 10px; color: #a6adc8">Real-time update</span>
        </div>
        <textarea id="css-code" class="css-textarea" spellcheck="false"></textarea>
      </div>

      <!-- Preview Pane -->
      <div class="preview-pane">
        <div class="pane-header">
          <span>Live Preview</span>
        </div>
        <div class="preview-area">
          <div class="target-container">
            <div id="preview-target">Target</div>

            <!-- Box model inspector layer -->
            <div id="box-inspector" class="box-inspector">
              <!-- Margin overlay -->
              <div id="inspect-margin" class="inspect-box inspect-margin">
                <span class="inspect-label label-margin">margin</span>
              </div>
              <!-- Padding overlay -->
              <div id="inspect-padding" class="inspect-box inspect-padding">
                <span class="inspect-label label-padding">padding</span>
              </div>
              <!-- Content overlay -->
              <div id="inspect-content" class="inspect-box inspect-content">
                <span class="inspect-label label-content">content</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Cubic Bezier Curve Inspector -->
        <div class="bezier-panel">
          <div class="bezier-canvas-wrapper">
            <canvas id="bezier-canvas" width="120" height="120"></canvas>
          </div>
          <div class="bezier-controls">
            <div class="bezier-row">
              <label>X1 / Y1</label>
              <input type="range" id="bez-x1" min="0" max="1" step="0.05" value="0.25" />
              <input type="range" id="bez-y1" min="0" max="1.5" step="0.05" value="0.1" />
              <span id="bez-txt-p1" class="bezier-val">0.25, 0.1</span>
            </div>
            <div class="bezier-row">
              <label>X2 / Y2</label>
              <input type="range" id="bez-x2" min="0" max="1" step="0.05" value="0.25" />
              <input type="range" id="bez-y2" min="0" max="1.5" step="0.05" value="1.0" />
              <span id="bez-txt-p2" class="bezier-val">0.25, 1.0</span>
            </div>
            <div class="bezier-row" style="font-size: 11px; color: #a6adc8">
              <span
                >Transition Timing Formula:
                <code id="bezier-formula" style="color: #ec4899">cubic-bezier(0.25, 0.1, 0.25, 1)</code></span
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Style element to inject user CSS dynamically -->
    <style id="dynamic-styles"></style>

    <script>
      const cssEditor = document.getElementById('css-code');
      const dynamicStyles = document.getElementById('dynamic-styles');
      const target = document.getElementById('preview-target');
      const toggleInspector = document.getElementById('toggle-inspector');
      const boxInspector = document.getElementById('box-inspector');
      const templateSelect = document.getElementById('template-select');
      const btnReset = document.getElementById('btn-reset');

      // Templates definitions
      const templates = {
        card: `/* Custom target styles */
#preview-target {
  width: 260px;
  height: auto;
  padding: 24px;
  margin: 10px;
  background: #181825;
  border: 1px solid #313244;
  border-radius: 12px;
  color: #cdd6f4;
  font-family: sans-serif;
  text-align: center;
  transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1), box-shadow 0.3s;
}

#preview-target:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(236, 72, 153, 0.2);
}`,
        spin: `/* Custom spinner styles */
#preview-target {
  width: 60px;
  height: 60px;
  background: transparent;
  border: 5px solid rgba(236, 72, 153, 0.1);
  border-top-color: #ec4899;
  border-radius: 50%;
  animation: spin 1s infinite linear;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}`,
        bounce: `/* Bounce animation styles */
#preview-target {
  width: 80px;
  height: 80px;
  background: linear-gradient(to bottom, #89b4fa, #b4befe);
  border-radius: 50%;
  animation: bounce 1.8s infinite ease-in-out;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0) scaleY(1);
  }
  40% {
    transform: translateY(-80px) scaleY(1.05);
  }
  50% {
    transform: translateY(-80px) scaleY(0.95);
  }
  90% {
    transform: translateY(0) scaleY(0.85);
  }
}`,
      };

      // Set initial template
      function loadTemplate(name) {
        cssEditor.value = templates[name];
        updateStyles();
      }

      function updateStyles() {
        dynamicStyles.textContent = cssEditor.value;
        setTimeout(updateInspector, 50); // Delay slightly to let layout compute
      }

      cssEditor.addEventListener('input', updateStyles);
      templateSelect.addEventListener('change', (e) => loadTemplate(e.target.value));
      btnReset.addEventListener('click', () => loadTemplate(templateSelect.value));

      // Box Model Inspector logic
      function updateInspector() {
        if (!toggleInspector.checked) {
          boxInspector.classList.remove('active');
          return;
        }
        boxInspector.classList.add('active');

        // Compute box model values
        const style = window.getComputedStyle(target);
        const rect = target.getBoundingClientRect();
        const containerRect = target.parentElement.getBoundingClientRect();

        const width = rect.width;
        const height = rect.height;

        const padTop = parseFloat(style.paddingTop);
        const padRight = parseFloat(style.paddingRight);
        const padBottom = parseFloat(style.paddingBottom);
        const padLeft = parseFloat(style.paddingLeft);

        const margTop = parseFloat(style.marginTop);
        const margRight = parseFloat(style.marginRight);
        const margBottom = parseFloat(style.marginBottom);
        const margLeft = parseFloat(style.marginLeft);

        const leftOffset = target.offsetLeft;
        const topOffset = target.offsetTop;

        // Content Box Overlay
        const contentBox = document.getElementById('inspect-content');
        contentBox.style.left = `${leftOffset + padLeft}px`;
        contentBox.style.top = `${topOffset + padTop}px`;
        contentBox.style.width = `${width - padLeft - padRight - 2}px`;
        contentBox.style.height = `${height - padTop - padBottom - 2}px`;

        // Padding Box Overlay
        const paddingBox = document.getElementById('inspect-padding');
        paddingBox.style.left = `${leftOffset}px`;
        paddingBox.style.top = `${topOffset}px`;
        paddingBox.style.width = `${width - 2}px`;
        paddingBox.style.height = `${height - 2}px`;

        // Margin Box Overlay
        const marginBox = document.getElementById('inspect-margin');
        marginBox.style.left = `${leftOffset - margLeft}px`;
        marginBox.style.top = `${topOffset - margTop}px`;
        marginBox.style.width = `${width + margLeft + margRight - 2}px`;
        marginBox.style.height = `${height + margTop + margBottom - 2}px`;
      }

      toggleInspector.addEventListener('change', updateInspector);
      window.addEventListener('resize', updateInspector);

      // Easing Curve Editor logic
      const bezCanvas = document.getElementById('bezier-canvas');
      const bezCtx = bezCanvas.getContext('2d');
      const bezX1 = document.getElementById('bez-x1');
      const bezY1 = document.getElementById('bez-y1');
      const bezX2 = document.getElementById('bez-x2');
      const bezY2 = document.getElementById('bez-y2');
      const bezTxtP1 = document.getElementById('bez-txt-p1');
      const bezTxtP2 = document.getElementById('bez-txt-p2');
      const bezFormula = document.getElementById('bezier-formula');

      function drawBezier() {
        const w = bezCanvas.width;
        const h = bezCanvas.height;
        bezCtx.clearRect(0, 0, w, h);

        // Grid lines
        bezCtx.strokeStyle = '#313244';
        bezCtx.lineWidth = 1;
        bezCtx.beginPath();
        bezCtx.moveTo(0, h);
        bezCtx.lineTo(w, 0);
        bezCtx.stroke();

        const x1 = parseFloat(bezX1.value);
        const y1 = parseFloat(bezY1.value);
        const x2 = parseFloat(bezX2.value);
        const y2 = parseFloat(bezY2.value);

        // Convert normalized values to canvas coordinates
        // 0,0 is bottom-left (0, h); 1,1 is top-right (w, 0)
        // y values can go above 1.0 (overshoot)
        const scaleY = h * 0.7; // leave 30% margin at the top for overshoot
        const offsetDecayY = h - 15;

        const px0 = 15;
        const py0 = h - 15;
        const px3 = w - 15;
        const py3 = 15;

        const cw = px3 - px0;
        const ch = py0 - py3;

        const cx1 = px0 + x1 * cw;
        const cy1 = py0 - y1 * ch;
        const cx2 = px0 + x2 * cw;
        const cy2 = py0 - y2 * ch;

        // Draw handles lines
        bezCtx.strokeStyle = '#585b70';
        bezCtx.lineWidth = 1;
        bezCtx.beginPath();
        bezCtx.moveTo(px0, py0);
        bezCtx.lineTo(cx1, cy1);
        bezCtx.moveTo(px3, py3);
        bezCtx.lineTo(cx2, cy2);
        bezCtx.stroke();

        // Draw bezier curve
        bezCtx.strokeStyle = '#ec4899';
        bezCtx.lineWidth = 3;
        bezCtx.beginPath();
        bezCtx.moveTo(px0, py0);
        bezCtx.bezierCurveTo(cx1, cy1, cx2, cy2, px3, py3);
        bezCtx.stroke();

        // Draw handle points
        bezCtx.fillStyle = '#f5e0dc';
        bezCtx.beginPath();
        bezCtx.arc(cx1, cy1, 4, 0, Math.PI * 2);
        bezCtx.arc(cx2, cy2, 4, 0, Math.PI * 2);
        bezCtx.fill();

        // Update text labels
        bezTxtP1.textContent = `${x1.toFixed(2)}, ${y1.toFixed(2)}`;
        bezTxtP2.textContent = `${x2.toFixed(2)}, ${y2.toFixed(2)}`;
        const formula = `cubic-bezier(${x1.toFixed(2)}, ${y1.toFixed(2)}, ${x2.toFixed(2)}, ${y2.toFixed(2)})`;
        bezFormula.textContent = formula;

        // Apply easing curve to hover transition if active in editor code
        const customStyles = cssEditor.value;
        if (customStyles.includes('cubic-bezier')) {
          // Find transition line and replace it with current formula
          const modified = customStyles.replace(/cubic-bezier\([^\)]+\)/g, formula);
          dynamicStyles.textContent = modified;
        }
      }

      [bezX1, bezY1, bezX2, bezY2].forEach((input) => input.addEventListener('input', drawBezier));

      // Init app
      loadTemplate('card');
      drawBezier();
    </script>
  </body>
</html>
