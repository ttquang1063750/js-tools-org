<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ Binary Search Tree (BST) Visualizer - js-tools.org</title>
  <style>
    body {
      background-color: #0a0f1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
    }
    h1 {
      color: #10b981;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #9ca3af;
      margin-bottom: 30px;
      text-align: center;
    }
    .visualizer-container {
      background: #0f1423;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .visualizer-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      align-items: center;
    }
    .visualizer-controls input {
      background: #151b2e;
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      width: 100px;
      outline: none;
      font-size: 14px;
    }
    .btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      font-size: 14px;
    }
    .btn:hover {
      background: #059669;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .btn-danger {
      background: #ef4444;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .canvas-wrap {
      background: #090d16;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      font-family: monospace;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>C++ Binary Search Tree (BST) Visualizer</h1>
  <div class="subtitle">Mô phỏng trực quan cây tìm kiếm nhị phân được lập trình bằng C++ OOP trên trình duyệt</div>

  <div class="visualizer-container">
    <div class="visualizer-controls">
      <input type="number" id="nodeValue" placeholder="Giá trị" min="1" max="999">
      <button class="btn" onclick="insertNode()">Thêm Node</button>
      <button class="btn btn-secondary" onclick="searchNode()">Tìm Kiếm</button>
      <button class="btn btn-danger" onclick="deleteNode()">Xóa Node</button>
      <button class="btn btn-secondary" onclick="resetTree()" style="margin-left: auto;">Reset</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="bstCanvas" width="800" height="400"></canvas>
    </div>

    <div class="status-msg" id="statusBox">Cây hiện đang trống. Nhập giá trị và nhấn "Thêm Node" để bắt đầu!</div>
  </div>

  <script>
    class BSTNode {
      constructor(val) {
        this.value = val;
        this.left = null;
        this.right = null;
        this.x = 400; // Tọa độ render trên Canvas
        this.y = 50;
      }
    }

    let root = null;
    const canvas = document.getElementById("bstCanvas");
    const ctx = canvas.getContext("2d");
    const statusBox = document.getElementById("statusBox");

    function setStatus(msg, isError = false) {
      statusBox.innerHTML = msg;
      statusBox.style.background = isError ? "rgba(239, 68, 68, 0.1)" : "rgba(16, 185, 129, 0.1)";
      statusBox.style.color = isError ? "#ef4444" : "#10b981";
    }

    // Các thuật toán C++ BST chuyển thể sang JS để vẽ
    function insert(node, val, x, y, level = 1) {
      if (node === null) {
        let newNode = new BSTNode(val);
        newNode.x = x;
        newNode.y = y;
        return newNode;
      }

      // Khoảng cách ngang thu hẹp dần theo độ sâu của cây
      const offset = 180 / Math.pow(1.6, level);

      if (val < node.value) {
        node.left = insert(node.left, val, x - offset, y + 60, level + 1);
      } else if (val > node.value) {
        node.right = insert(node.right, val, x + offset, y + 60, level + 1);
      } else {
        setStatus(`Node ${val} đã tồn tại trong cây!`, true);
      }
      return node;
    }

    function findMin(node) {
      while (node.left !== null) {
        node = node.left;
      }
      return node;
    }

    function remove(node, val) {
      if (node === null) {
        setStatus(`Không tìm thấy node ${val} để xóa!`, true);
        return null;
      }

      if (val < node.value) {
        node.left = remove(node.left, val);
      } else if (val > node.value) {
        node.right = remove(node.right, val);
      } else {
        // Node cần xóa
        if (node.left === null && node.right === null) {
          node = null;
          setStatus(`Đã xóa node lá ${val}`);
        } else if (node.left === null) {
          setStatus(`Đã xóa node ${val}, đưa node con bên phải lên thay thế.`);
          node = node.right;
        } else if (node.right === null) {
          setStatus(`Đã xóa node ${val}, đưa node con bên trái lên thay thế.`);
          node = node.left;
        } else {
          // Node có 2 con: tìm node nhỏ nhất bên phải thế chỗ
          let temp = findMin(node.right);
          setStatus(`Node ${val} có 2 con. Thay thế bằng giá trị nhỏ nhất của cây con phải (${temp.value}) và xóa nó.`);
          node.value = temp.value;
          node.right = remove(node.right, temp.value);
        }
      }
      return node;
    }

    function search(node, val) {
      if (node === null) {
        setStatus(`Không tìm thấy node ${val} trong cây!`, true);
        return null;
      }
      if (val === node.value) {
        setStatus(`Tìm thấy node ${val} thành công!`);
        return node;
      }
      if (val < node.value) {
        return search(node.left, val);
      }
      return search(node.right, val);
    }

    // Vẽ cây nhị phân lên Canvas
    function drawTree() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (root !== null) {
        // Cập nhật lại tọa độ x, y để căn giữa động nếu cây thay đổi sâu
        recalculateCoords(root, 400, 50, 1);
        drawConnections(root);
        drawNodes(root);
      }
    }

    function recalculateCoords(node, x, y, level) {
      if (node === null) return;
      node.x = x;
      node.y = y;
      const offset = 180 / Math.pow(1.6, level);
      recalculateCoords(node.left, x - offset, y + 60, level + 1);
      recalculateCoords(node.right, x + offset, y + 60, level + 1);
    }

    function drawConnections(node) {
      if (node === null) return;
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";

      if (node.left !== null) {
        ctx.beginPath();
        ctx.moveTo(node.x, node.y);
        ctx.lineTo(node.left.x, node.left.y);
        ctx.stroke();
        drawConnections(node.left);
      }

      if (node.right !== null) {
        ctx.beginPath();
        ctx.moveTo(node.x, node.y);
        ctx.lineTo(node.right.x, node.right.y);
        ctx.stroke();
        drawConnections(node.right);
      }
    }

    function drawNodes(node) {
      if (node === null) return;

      // Vẽ vòng tròn node
      ctx.beginPath();
      ctx.arc(node.x, node.y, 20, 0, 2 * Math.PI);
      let gradient = ctx.createRadialGradient(node.x, node.y, 5, node.x, node.y, 20);
      gradient.addColorStop(0, "#10b981");
      gradient.addColorStop(1, "#047857");
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Vẽ text giá trị node
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(node.value, node.x, node.y);

      drawNodes(node.left);
      drawNodes(node.right);
    }

    // Các hàm trigger từ Button
    function insertNode() {
      const input = document.getElementById("nodeValue");
      const val = parseInt(input.value);
      if (isNaN(val)) {
        setStatus("Hãy nhập một giá trị số nguyên hợp lệ!", true);
        return;
      }
      if (val < 1 || val > 999) {
        setStatus("Hãy nhập giá trị từ 1 đến 999!", true);
        return;
      }

      setStatus(`Đang chèn node ${val}...`);
      root = insert(root, val, 400, 50, 1);
      drawTree();
      input.value = "";
    }

    function deleteNode() {
      const input = document.getElementById("nodeValue");
      const val = parseInt(input.value);
      if (isNaN(val)) {
        setStatus("Hãy nhập một giá trị số nguyên hợp lệ để xóa!", true);
        return;
      }
      root = remove(root, val);
      drawTree();
      input.value = "";
    }

    function searchNode() {
      const input = document.getElementById("nodeValue");
      const val = parseInt(input.value);
      if (isNaN(val)) {
        setStatus("Hãy nhập một giá trị số nguyên hợp lệ để tìm kiếm!", true);
        return;
      }
      let found = search(root, val);
      if (found) {
        // Tô viền đỏ tạm thời cho node được tìm thấy
        drawTree();
        ctx.beginPath();
        ctx.arc(found.x, found.y, 24, 0, 2 * Math.PI);
        ctx.strokeStyle = "#fbbf24"; // Màu vàng nhấn mạnh tìm kiếm
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      input.value = "";
    }

    function resetTree() {
      root = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      setStatus("Cây đã được dọn sạch. Cây hiện tại rỗng.");
    }

    // Khởi tạo một vài node demo
    window.onload = function() {
      const demoValues = [50, 30, 70, 20, 40, 60, 80];
      demoValues.forEach(val => {
        root = insert(root, val, 400, 50, 1);
      });
      drawTree();
      setStatus("Cây tìm kiếm nhị phân đã được dựng demo thành công!");
    }
  </script>
</body>
</html>
