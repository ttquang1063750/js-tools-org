<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Structure Visualizer - js-tools.org</title>
    <link rel="canonical" href="https://js-tools.org/blog/c/ds_visualizer" />
    <style>
      body {
        background-color: #0a0f1e;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        color: #4f8ef7;
        margin-bottom: 30px;
      }
      .visualizer-container {
        background: #0f1423;
        border: 1px solid rgba(79, 142, 247, 0.18);
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 800px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }
      .visualizer-controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 24px;
        align-items: center;
      }
      .visualizer-controls input {
        background: #151b2e;
        border: 1px solid rgba(79, 142, 247, 0.3);
        color: #fff;
        padding: 10px 14px;
        border-radius: 8px;
        width: 100px;
        outline: none;
      }
      .btn {
        background: #4f8ef7;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #3b7ad4;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .visualizer-canvas-wrap {
        background: #090d16;
        padding: 32px 24px;
        border-radius: 8px;
        min-height: 150px;
        overflow-x: auto;
        display: flex;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .visualizer-list {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .node-item {
        display: flex;
        align-items: center;
      }
      .node-box {
        background: linear-gradient(135deg, #4f8ef7 0%, #a78bfa 100%);
        padding: 16px 20px;
        border-radius: 8px;
        min-width: 80px;
        text-align: center;
        font-weight: 700;
        font-family: monospace;
        box-shadow: 0 4px 15px rgba(79, 142, 247, 0.25);
      }
      .node-arrow {
        font-size: 1.4rem;
        color: #4f8ef7;
        margin: 0 4px;
      }
      .visualizer-null-pointer {
        background: rgba(255, 255, 255, 0.06);
        border: 1px dashed rgba(255, 255, 255, 0.2);
        padding: 16px 20px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.4);
        font-weight: bold;
        font-family: monospace;
      }
      .visualizer-log {
        margin-top: 16px;
        background: rgba(0, 0, 0, 0.2);
        padding: 12px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 13px;
        color: #4f8ef7;
        border-left: 3px solid #4f8ef7;
      }
    </style>
  </head>
  <body>
    <h1>Mô phỏng Cấu trúc dữ liệu tương tác</h1>

    <div class="visualizer-container">
      <div class="visualizer-controls">
        <input type="number" id="nodeValue" placeholder="Giá trị" value="10" min="1" max="999" />
        <button class="btn" onclick="visualizeInsertHead()">Insert Head</button>
        <button class="btn" onclick="visualizeInsertTail()">Insert Tail</button>
        <button class="btn btn-secondary" onclick="visualizeDeleteHead()">Delete Head</button>
        <button class="btn btn-secondary" onclick="visualizeClear()" style="color: #f43f5e">Clear All</button>
      </div>

      <div class="visualizer-canvas-wrap">
        <div id="visualizerList" class="visualizer-list"></div>
      </div>

      <div id="visualizerLog" class="visualizer-log">Log: Sẵn sàng thực hiện thuật toán...</div>
    </div>

    <script>
      var listData = [10, 20, 30];
      var logEl = document.getElementById('visualizerLog');

      function updateLog(msg) {
        logEl.textContent = 'Log: ' + msg;
      }

      function renderList() {
        var container = document.getElementById('visualizerList');
        container.innerHTML = '';

        listData.forEach(function (val) {
          var nodeItem = document.createElement('div');
          nodeItem.className = 'node-item';

          var nodeBox = document.createElement('div');
          nodeBox.className = 'node-box';
          nodeBox.innerHTML = '<div style="font-size:11px;opacity:0.8;font-weight:normal;">val:</div> ' + val;
          nodeItem.appendChild(nodeBox);

          var arrow = document.createElement('div');
          arrow.className = 'node-arrow';
          arrow.innerHTML = '➔';
          nodeItem.appendChild(arrow);

          container.appendChild(nodeItem);
        });

        var nullBox = document.createElement('div');
        nullBox.className = 'visualizer-null-pointer';
        nullBox.textContent = 'NULL';
        container.appendChild(nullBox);
      }

      function visualizeInsertHead() {
        var input = document.getElementById('nodeValue');
        var val = parseInt(input.value);
        if (isNaN(val)) {
          updateLog('Vui lòng nhập giá trị hợp lệ!');
          return;
        }
        listData.unshift(val);
        renderList();
        updateLog('Khởi tạo Node(' + val + '), gán Node(' + val + ')->next = head; sau đó head = Node(' + val + ')');
      }

      function visualizeInsertTail() {
        var input = document.getElementById('nodeValue');
        var val = parseInt(input.value);
        if (isNaN(val)) {
          updateLog('Vui lòng nhập giá trị hợp lệ!');
          return;
        }
        listData.push(val);
        renderList();
        updateLog('Duyệt đến cuối danh sách (next == NULL), gán Node cuối->next = Node(' + val + ')');
      }

      function visualizeDeleteHead() {
        if (listData.length === 0) {
          updateLog('Danh sách đang rỗng, không thể xóa!');
          return;
        }
        var removedVal = listData.shift();
        renderList();
        updateLog(
          'Lưu temp = head; dịch head = head->next; free(temp) để giải phóng vùng nhớ Node(' + removedVal + ')'
        );
      }

      function visualizeClear() {
        listData = [];
        renderList();
        updateLog('Giải phóng toàn bộ danh sách liên kết đơn thành công!');
      }

      renderList();
    </script>
  </body>
</html>
