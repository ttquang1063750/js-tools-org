# docker-compose.yml — Traffic Lab dùng chung cho cả Series 20 (Thiết Kế Hệ Thống).
#
# TRIẾT LÝ: MỘT stack duy nhất, mở rộng dần qua các bài học bằng Docker Compose
# `profiles`. Bạn không phải dựng lại môi trường mới ở mỗi bài — chỉ bật thêm profile.
#
#   Bài 2  →  docker compose --profile base up -d      (1 app server, đo giới hạn)
#   Bài 3  →  docker compose --profile lb up -d        (nginx + 3 app replica)
#   Bài 4  →  docker compose --profile gw up -d        (API gateway: TLS + route theo path)
#   Bài 5  →  docker compose --profile cache up -d     (thêm Redis)
#   Bài 6  →  docker compose --profile edge up -d      (tầng edge có proxy_cache)
#   Bài 7  →  docker compose --profile replica up -d   (PostgreSQL primary + read replica)
#
# KHÔNG có Dockerfile và KHÔNG cần `npm install`: code được bind-mount thẳng vào image
# node chính thức, nên bạn sửa file là chạy lại thấy ngay, và đọc được toàn bộ code.

name: sysdesign-lab

# Cấu hình chung cho mọi app server — YAML anchor để không lặp lại 3 lần.
x-app-base: &app-base
  image: node:22-alpine
  working_dir: /app
  volumes:
    - ./app:/app:ro
  command: ['node', 'app.js']
  environment:
    PORT: '3000'
    DB_DELAY_MS: '40' # độ trễ "database" giả lập, để thấy giá trị của cache (Bài 5)
    # Số truy vấn database đồng thời tối đa — connection pool giả lập. Có giới hạn này thì
    # thundering herd mới biến thành ĐỘ TRỄ chứ không chỉ là số truy vấn tăng (Bài 5, 5.4).
    DB_MAX_CONCURRENCY: '10'
    GRACEFUL: '1' # đặt '0' để xem hậu quả khi thiếu graceful shutdown (Bài 3)
    # Số chặng proxy TIN CẬY phía trước. '0' = không tin X-Forwarded-For (mặc định an
    # toàn). Đặt '1' khi có đúng một gateway ở trước, rồi gọi /client-ip để thấy khác
    # biệt giữa đọc từ trái (giả mạo được) và đọc từ phải (Bài 4, mục 4.2).
    TRUST_PROXY_HOPS: '0'
  restart: unless-stopped
  # Giới hạn tài nguyên để kết quả đo ổn định và không phụ thuộc máy bạn mạnh cỡ nào.
  # QUAN TRỌNG: 1 CPU cho mỗi app là chủ ý — Node chỉ có một luồng JS, và ta muốn
  # thấy đúng hiện tượng nghẽn ở tầng ứng dụng (Bài 2 mục 2.2).
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 256M

services:
  # ─────────────────────────────────────────────────────────────
  # APP SERVERS
  # ─────────────────────────────────────────────────────────────
  # INSTANCE được đặt riêng cho từng replica: nhờ đó `/whoami` và header `X-Instance`
  # cho biết chính xác replica nào đã phục vụ request — cách đơn giản nhất để thấy
  # load balancer phân phối thật sự ra sao (Bài 3).
  app1:
    <<: *app-base
    profiles: ['base', 'gw', 'lb', 'edge', 'cache', 'db', 'replica']
    environment:
      PORT: '3000'
      DB_DELAY_MS: '40'
      DB_MAX_CONCURRENCY: '10'
      GRACEFUL: '1'
      INSTANCE: 'app1'
      TRUST_PROXY_HOPS: '0'
      REDIS_URL: 'redis://redis:6379'
      # Bai 7: GHI di primary, DOC di replica. Doi READ_PIN_MS thanh vi du '500' de bat
      # co che ghim-ve-primary sau khi ghi, roi do lai ti le doc ra du lieu cu.
      PG_PRIMARY: 'postgres'
      PG_REPLICA: 'postgres-replica'
      READ_PIN_MS: '0'
    ports:
      # Chỉ app1 mở cổng ra host, để Bài 2 gọi trực tiếp không qua LB.
      - '3001:3000'

  app2:
    <<: *app-base
    profiles: ['gw', 'lb', 'edge', 'cache', 'db', 'replica']
    environment:
      PORT: '3000'
      DB_DELAY_MS: '40'
      DB_MAX_CONCURRENCY: '10'
      GRACEFUL: '1'
      INSTANCE: 'app2'
      TRUST_PROXY_HOPS: '0'
      REDIS_URL: 'redis://redis:6379'
      # Bai 7: GHI di primary, DOC di replica. Doi READ_PIN_MS thanh vi du '500' de bat
      # co che ghim-ve-primary sau khi ghi, roi do lai ti le doc ra du lieu cu.
      PG_PRIMARY: 'postgres'
      PG_REPLICA: 'postgres-replica'
      READ_PIN_MS: '0'

  app3:
    <<: *app-base
    profiles: ['gw', 'lb', 'edge', 'cache', 'db', 'replica']
    environment:
      PORT: '3000'
      DB_DELAY_MS: '40'
      DB_MAX_CONCURRENCY: '10'
      GRACEFUL: '1'
      INSTANCE: 'app3'
      TRUST_PROXY_HOPS: '0'
      REDIS_URL: 'redis://redis:6379'
      # Bai 7: GHI di primary, DOC di replica. Doi READ_PIN_MS thanh vi du '500' de bat
      # co che ghim-ve-primary sau khi ghi, roi do lai ti le doc ra du lieu cu.
      PG_PRIMARY: 'postgres'
      PG_REPLICA: 'postgres-replica'
      READ_PIN_MS: '0'

  # ─────────────────────────────────────────────────────────────
  # LOAD BALANCER (Bài 3, Bài 4)
  # ─────────────────────────────────────────────────────────────
  lb:
    image: nginx:1.27-alpine
    profiles: ['lb', 'cache', 'db', 'replica']
    ports:
      - '8080:8080'
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logformat.conf:/etc/nginx/conf.d/00-logformat.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # API GATEWAY (Bài 4)
  #
  # Mo CA HAI cong de do duoc chi phi TLS thuan: 8081 (HTTP) va 8443 (HTTPS)
  # dung CHUNG file route (nginx/gw-routes.conf) nen chenh lech chi den tu TLS.
  #
  # Chung chi tu ky phai sinh truoc khi bat profile nay - xem README.
  # ─────────────────────────────────────────────────────────────
  gw:
    image: nginx:1.27-alpine
    profiles: ['gw']
    ports:
      - '8081:8081'
      - '8443:8443'
    volumes:
      - ./nginx/gw.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/gw-routes.conf:/etc/nginx/snippets/gw-routes.conf:ro
      - ./nginx/logformat.conf:/etc/nginx/conf.d/00-logformat.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./static:/usr/share/nginx/static:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # EDGE / CDN (Bài 6)
  #
  # nginx thu hai, nhung khac han: no LUU LAI phan hoi (proxy_cache) thay vi chi
  # chuyen tiep. Cache nam tren tmpfs de phep do khong bi lan cho phi bind-mount
  # cua Docker Desktop — bai hoc da gap chuyen nay o Bai 4 muc 4.3.
  # ─────────────────────────────────────────────────────────────
  edge:
    image: nginx:1.27-alpine
    profiles: ['edge']
    ports:
      - '8082:8082'
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/edge-common.conf:/etc/nginx/snippets/edge-common.conf:ro
      - ./nginx/logformat.conf:/etc/nginx/conf.d/00-logformat.conf:ro
    tmpfs:
      - /var/cache/nginx
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # CACHE (Bài 5)
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    profiles: ['cache', 'db']
    ports:
      - '6379:6379'
    # maxmemory nhỏ có chủ ý: để bạn tự gây ra tình trạng eviction và quan sát
    # chính sách LRU hoạt động (Bài 5, mục 5.5).
    command: ['redis-server', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru', '--appendonly', 'no']
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # DATABASE — PRIMARY (Bài 7, Bài 8)
  #
  # `command` bat cac tham so can cho streaming replication:
  #   wal_level=replica    ghi du thong tin vao WAL de replica dung lai duoc
  #   max_wal_senders      so ket noi replication dong thoi toi da
  #   wal_keep_size        giu lai WAL de replica bi cham con bat kip; het thi
  #                        replica phai basebackup lai tu dau
  #   hot_standby=on       cho phep DOC tren replica (khong co no replica chi la ban sao)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18
    profiles: ['db', 'replica']
    environment:
      POSTGRES_PASSWORD: labpass
      POSTGRES_USER: lab
      POSTGRES_DB: lab
      # `trust` CHI dung cho lab: no cho ket noi khong can mat khau trong mang noi bo
      # cua compose, nho do minipg.js khong phai cai dat SCRAM-SHA-256.
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - '-c'
      - 'wal_level=replica'
      - '-c'
      - 'max_wal_senders=10'
      - '-c'
      - 'wal_keep_size=128MB'
      - '-c'
      - 'hot_standby=on'
      - '-c'
      - 'log_min_duration_statement=500'
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # DATABASE — READ REPLICA (Bài 7)
  #
  # KHONG co Dockerfile: replica tu dung chinh minh bang pg_basebackup trong entrypoint.
  #   -Fp  ghi ra dang thu muc thuong (khong nen thanh tar)
  #   -Xs  stream WAL song song luc backup => backup xong la dung ngay duoc
  #   -R   tu sinh standby.signal + primary_conninfo, nho do khoi phai viet tay
  #
  # `restart: no` co chu y: neu replica chet vi cau hinh sai thi ta muon THAY loi
  # trong log, khong muon Docker che no di bang cach khoi dong lai lien tuc.
  # ─────────────────────────────────────────────────────────────
  postgres-replica:
    image: postgres:18
    profiles: ['replica']
    user: postgres
    environment:
      # PGDATA cua PostgreSQL 18 ban Debian KHONG phai /var/lib/postgresql/data.
      # Dat sai thi pg_basebackup ghi vao mot cho ma server khong doc — replica len
      # duoc nhung la mot database rong, va loi nay rat kho nhan ra.
      PGDATA: /var/lib/postgresql/18/docker
    # Dung `sh` cho chac: image postgres ban Debian co bash nhung ban Alpine thi KHONG,
    # nen script nay viet bang POSIX sh de chay duoc voi ca hai.
    entrypoint:
      - sh
      - '-c'
      - |
        set -e
        until pg_isready -h postgres -U lab -q; do
          echo "[replica] cho primary..."; sleep 1
        done
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo "[replica] chua co du lieu -> pg_basebackup tu primary"
          rm -rf "$$PGDATA"/*
          pg_basebackup -h postgres -U replicator -D "$$PGDATA" -Fp -Xs -R -P
          echo "[replica] basebackup xong"
        fi
        exec postgres -c hot_standby=on
    ports:
      - '5433:5432'
    depends_on:
      - postgres
    restart: 'no'

  # ─────────────────────────────────────────────────────────────
  # BỘ ĐO TẢI
  #
  # Không tự chạy (`profiles: [tools]`) — bạn gọi thủ công khi muốn đo:
  #   docker compose run --rm loadgen node loadgen.js --url http://lb:8080/fast -c 20 -d 15
  # ─────────────────────────────────────────────────────────────
  loadgen:
    image: node:22-alpine
    profiles: ['tools']
    working_dir: /loadgen
    volumes:
      - ./loadgen:/loadgen:ro
    entrypoint: ['node']
    command: ['loadgen.js', '--help']
    deploy:
      resources:
        limits:
          # Cho loadgen nhiều CPU hơn app để chính nó không thành nút cổ chai.
          # Nếu thấy container này chạm 100% CPU thì số đo đã vô nghĩa (xem loadgen.js).
          cpus: '2.0'
