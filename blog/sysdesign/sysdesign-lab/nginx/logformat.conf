# logformat.conf — khai báo định dạng log dùng cho LB.
#
# File này được nạp trước `default.conf` (nhờ tên bắt đầu bằng 00-) và nằm trong khối
# `http` của nginx, đúng nơi chỉ thị `log_format` được phép xuất hiện.
#
# Điểm đáng giá: `to=$upstream_addr` cho biết request đã được chuyển tới upstream NÀO, nhờ
# đó tự đếm được phân phối tải mà không cần công cụ ngoài (Bài 3, mục 3.3):
#
#   docker compose logs --no-log-prefix lb | grep -o 'to=[0-9.:]*' | sort | uniq -c
#
# `ut=$upstream_response_time` là thời gian upstream xử lý, còn `rt=$request_time` là tổng
# thời gian nginx thấy. Chênh lệch giữa hai số này chính là phần nginx và mạng nội bộ tiêu tốn.

log_format lbfmt
    '$remote_addr "$request" status=$status '
    'to=$upstream_addr ut=$upstream_response_time rt=$request_time '
    'tries=$upstream_status';
