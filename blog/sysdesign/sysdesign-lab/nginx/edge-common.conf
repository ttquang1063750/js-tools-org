# edge-common.conf — cấu hình cache dùng chung cho mọi location của tầng edge.
#
# Tách riêng để hai location (/cacheable với key THÔ và /norm/cacheable với key
# CHUẨN HOÁ) chỉ khác nhau đúng một dòng `proxy_cache_key`. Nếu copy-paste hai bản,
# chênh lệch hit ratio đo được sẽ lẫn cả khác biệt cấu hình vào.

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;

proxy_cache edge_zone;

# Chỉ cache 200/301/302. Cache cả 404 trong thời gian ngắn để một URL sai bị dò
# liên tục không đập thẳng vào app.
proxy_cache_valid 200 301 302 60s;
proxy_cache_valid 404 10s;

# Dùng ETag/Last-Modified để revalidate: khi TTL hết, nginx gửi If-None-Match và
# origin trả 304 không kèm body — tiết kiệm băng thông thay vì tải lại toàn bộ.
proxy_cache_revalidate on;

# SINGLE-FLIGHT Ở TẦNG EDGE — cùng ý tưởng Bài 5 mục 5.4, nhưng do nginx làm:
# nhiều request cùng miss một key thì chỉ MỘT request được đi tới origin.
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;

# TRẢ BẢN CŨ thay vì trả lỗi — đây là thứ giữ site còn sống khi origin sập.
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on; # làm mới ở nền, người dùng không phải chờ

proxy_connect_timeout 2s;
proxy_read_timeout 10s;
