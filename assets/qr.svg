<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <style>
      :root {
        --color-primary: #059669;
        --color-info: #06b6d4;
        --color-border: #dddddd;
        --color-warning: #faad14;
        --color-danger: #ff4d4f;
        --color-success: #52c41a;
        --color-text-faint: #bbbbbb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-primary: #34d399;
          --color-info: #22d3ee;
          --color-border: #3a3f4a;
          --color-warning: #ffc53d;
          --color-danger: #ff7875;
          --color-success: #73d13d;
          --color-text-faint: #555962;
        }
      }
      .bg-grad-a {
        fill: url(#logo-grad-a);
      }
      .bg-grad-b {
        fill: url(#logo-grad-b);
      }
      .border-stroke {
        stroke: var(--color-border);
      }
      .color-primary {
        fill: var(--color-primary);
      }
      .stroke-primary {
        stroke: var(--color-primary);
      }
      .color-info {
        fill: var(--color-info);
      }
      .color-warning {
        fill: var(--color-warning);
      }
      .color-danger {
        fill: var(--color-danger);
      }
      .color-success {
        fill: var(--color-success);
      }
      .color-text-faint {
        fill: var(--color-text-faint);
      }
      .text-badge {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #ffffff;
      }
    </style>
    <linearGradient id="logo-grad-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--color-primary)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="var(--color-primary)" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="logo-grad-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--color-info)" stop-opacity="0.18" />
      <stop offset="100%" stop-color="var(--color-info)" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <g transform="translate(0 20)">
    <!-- back card: Customization Settings -->
    <g transform="translate(20 30) rotate(-6)">
      <rect width="180" height="140" rx="14" class="bg-grad-a border-stroke" stroke-width="1.5" />
      <!-- Color Picker UI Mockup -->
      <circle cx="30" cy="30" r="10" fill="#ff5577" />
      <circle cx="56" cy="30" r="10" fill="#40a9ff" />
      <circle cx="82" cy="30" r="10" class="color-primary" />
      
      <!-- Customization Sliders -->
      <rect x="20" y="60" width="140" height="6" rx="3" class="color-text-faint" opacity="0.3" />
      <circle cx="70" cy="63" r="8" class="color-primary" />

      <rect x="20" y="86" width="140" height="6" rx="3" class="color-text-faint" opacity="0.3" />
      <circle cx="110" cy="89" r="8" class="color-info" />

      <rect x="20" y="112" width="90" height="10" rx="5" class="color-text-faint" opacity="0.4" />
    </g>

    <!-- front card: Generated QR Code -->
    <g transform="translate(120 110) rotate(4)">
      <rect width="180" height="140" rx="14" class="bg-grad-b border-stroke" stroke-width="1.5" />
      
      <!-- QR Code Layout (Centered inside the card) -->
      <g transform="translate(48, 28)" class="color-primary">
        <!-- Top-Left Finder Pattern -->
        <path d="M0 0 H28 V28 H0 Z M4 4 H24 V24 H4 Z M8 8 H20 V20 H8 Z" fill-rule="evenodd" />
        
        <!-- Top-Right Finder Pattern -->
        <g transform="translate(56 0)">
          <path d="M0 0 H28 V28 H0 Z M4 4 H24 V24 H4 Z M8 8 H20 V20 H8 Z" fill-rule="evenodd" />
        </g>
        
        <!-- Bottom-Left Finder Pattern -->
        <g transform="translate(0 56)">
          <path d="M0 0 H28 V28 H0 Z M4 4 H24 V24 H4 Z M8 8 H20 V20 H8 Z" fill-rule="evenodd" />
        </g>

        <!-- QR Data Dots & Alignment -->
        <!-- Center shield logo placeholder -->
        <rect x="36" y="36" width="12" height="12" rx="2" class="color-info" />
        
        <!-- Random modules -->
        <rect x="36" y="8" width="4" height="4" />
        <rect x="44" y="12" width="4" height="4" />
        <rect x="36" y="20" width="4" height="4" />
        <rect x="48" y="0" width="4" height="4" />
        
        <rect x="8" y="36" width="4" height="4" />
        <rect x="16" y="44" width="4" height="4" />
        <rect x="0" y="48" width="4" height="4" />
        
        <rect x="56" y="36" width="4" height="4" />
        <rect x="76" y="40" width="4" height="4" />
        <rect x="68" y="48" width="4" height="4" />
        
        <rect x="36" y="56" width="4" height="4" />
        <rect x="44" y="64" width="4" height="4" />
        <rect x="52" y="72" width="4" height="4" />
        <rect x="76" y="60" width="4" height="4" />
        <rect x="68" y="68" width="4" height="4" />
        <rect x="60" y="80" width="4" height="4" />

        <rect x="80" y="8" width="4" height="4" />
        <rect x="80" y="20" width="4" height="4" />
        <rect x="72" y="24" width="4" height="4" />
      </g>
    </g>

    <!-- arrow between -->
    <g transform="translate(95 80)" opacity="0.65">
      <path d="M0 0 L24 24" class="stroke-primary" stroke-width="2" stroke-linecap="round" />
      <path d="M16 22 L24 24 L22 16" class="stroke-primary" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
