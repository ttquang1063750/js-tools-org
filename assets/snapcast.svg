<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="100%" height="100%">
  <defs>
    <style>
      .text-snap {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: currentColor;
      }
      .text-cast {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-weight: 700;
        fill: #2185c5;
      }
    </style>
  </defs>
  <text x="20" y="110" font-size="110" letter-spacing="-3">
    <tspan class="text-snap">Snap</tspan>
    <tspan class="text-cast">Cast</tspan>
  </text>
</svg>
