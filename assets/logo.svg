<svg viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="hyphen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#2185c5"/>
    </linearGradient>
    <style>
      .logo-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 64px;
        letter-spacing: -3px;
      }
      .part-js {
        font-weight: 800;
        fill: #ffffff;
      }
      .part-tools {
        font-weight: 700;
        fill: #2185c5;
      }
    </style>
  </defs>
  
  <!-- "js" Text -->
  <text x="10" y="68" class="logo-text part-js">js</text>
  
  <!-- Custom Vector Hyphen with Perfect Color Split -->
  <rect x="74" y="44" width="22" height="8" rx="2" fill="url(#hyphen-grad)"/>
  
  <!-- "tools" Text -->
  <text x="104" y="68" class="logo-text part-tools">tools</text>
</svg>
