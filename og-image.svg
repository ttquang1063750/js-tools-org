<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Image Optimizer logo gradients (dark mode colors hardcoded) -->
    <linearGradient id="io-grad-a" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ff5577" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff5577" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="io-grad-b" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#40a9ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#40a9ff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="315" rx="320" ry="210" fill="rgba(79,142,247,0.07)"/>
  <ellipse cx="1000" cy="315" rx="280" ry="190" fill="rgba(167,139,250,0.07)"/>

  <!-- ── Logo + headline ── -->
  <text x="80" y="108" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="900" fill="white">⚡ JS<tspan fill="url(#accent)">Tools</tspan></text>

  <text x="80" y="205" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" letter-spacing="-2" fill="white">Free browser-based</text>
  <text x="80" y="278" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" letter-spacing="-2" fill="url(#accent)">developer tools</text>
  <text x="80" y="335" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="rgba(255,255,255,0.45)" letter-spacing="-0.2">No sign-up · No server uploads · Open-source · Privacy-first</text>

  <!-- domain badge -->
  <rect x="80" y="352" width="156" height="28" rx="8" fill="rgba(79,142,247,0.12)" stroke="rgba(79,142,247,0.3)" stroke-width="1"/>
  <text x="158" y="371" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="rgba(79,142,247,0.9)" text-anchor="middle">js-tools.org</text>

  <!-- ══════════════════════════════════════
       CARD 1 — Image Optimizer
       x=80 y=400 w=490 h=175
  ══════════════════════════════════════ -->
  <rect x="80" y="400" width="490" height="175" rx="16" fill="#1a2035" stroke="rgba(79,142,247,0.22)" stroke-width="1.5"/>

  <!-- Image Optimizer logo inline, scaled ~0.22 (320→70px), placed left of card -->
  <g transform="translate(100, 418) scale(0.215)">
    <g transform="translate(0 20)">
      <!-- back card -->
      <g transform="translate(20 30) rotate(-6)">
        <rect width="180" height="140" rx="14" fill="url(#io-grad-a)" stroke="#3a3f4a" stroke-width="1.5"/>
        <circle cx="44" cy="44" r="14" fill="#ffc53d" opacity="0.6"/>
        <path d="M0 110 L50 70 L90 95 L130 60 L180 100 L180 140 L0 140 Z" fill="#ff5577" opacity="0.25"/>
        <rect x="12" y="118" width="60" height="14" rx="7" fill="#555962" opacity="0.5"/>
        <rect x="120" y="6" width="58" height="22" rx="11" fill="#ff4d4f" opacity="0.85"/>
        <text x="149" y="21" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#ffffff">2.4 MB</text>
      </g>
      <!-- front card -->
      <g transform="translate(120 110) rotate(4)">
        <rect width="180" height="140" rx="14" fill="url(#io-grad-b)" stroke="#3a3f4a" stroke-width="1.5"/>
        <circle cx="44" cy="44" r="14" fill="#ffc53d" opacity="0.7"/>
        <path d="M0 110 L50 70 L90 95 L130 60 L180 100 L180 140 L0 140 Z" fill="#40a9ff" opacity="0.3"/>
        <rect x="12" y="118" width="60" height="14" rx="7" fill="#555962" opacity="0.5"/>
        <rect x="124" y="6" width="54" height="22" rx="11" fill="#73d13d" opacity="0.95"/>
        <text x="151" y="21" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#ffffff">412 KB</text>
      </g>
      <!-- arrow -->
      <g transform="translate(95 80)" opacity="0.65">
        <path d="M0 0 L24 24" stroke="#ff5577" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 22 L24 24 L22 16" stroke="#ff5577" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Image Optimizer text info -->
  <text x="192" y="440" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="800" fill="white">Image Optimizer</text>
  <text x="192" y="466" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="rgba(255,255,255,0.42)">Compress JPEG · WebP · HEIC in your browser</text>
  <text x="192" y="492" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="rgba(79,142,247,0.85)">✓ Bulk   ✓ Watermark   ✓ Resize   ✓ HEIC</text>
  <text x="192" y="555" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="rgba(255,255,255,0.25)">image-optimizer.js-tools.org</text>

  <!-- ══════════════════════════════════════
       CARD 2 — Snapcast
       x=630 y=400 w=490 h=175
  ══════════════════════════════════════ -->
  <rect x="630" y="400" width="490" height="175" rx="16" fill="#1e1a35" stroke="rgba(167,139,250,0.22)" stroke-width="1.5"/>

  <!-- Snapcast logo inline: "Snap" white + "Cast" #2185c5, viewBox 560x150 → scale 0.31 = 174x47 -->
  <g transform="translate(648, 415) scale(0.305)">
    <text x="20" y="110" font-size="110" letter-spacing="-3"
          font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
      <tspan font-weight="800" fill="white">Snap</tspan><tspan font-weight="700" fill="#2185c5">Cast</tspan>
    </text>
  </g>

  <!-- Snapcast text info -->
  <text x="648" y="490" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="rgba(255,255,255,0.42)">Real-time photo slideshow for live events</text>
  <text x="648" y="516" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="rgba(167,139,250,0.85)">✓ QR guests   ✓ Live slideshow   ✓ Remote</text>
  <text x="648" y="555" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="rgba(255,255,255,0.25)">snapcast.js-tools.org</text>
</svg>
