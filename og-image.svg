<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1d27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2535"/>
      <stop offset="100%" style="stop-color:#1a1d27"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#211f35"/>
      <stop offset="100%" style="stop-color:#1a1d27"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid dots subtle -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left glow -->
  <ellipse cx="200" cy="315" rx="300" ry="200" fill="rgba(79,142,247,0.08)"/>
  <!-- Right glow -->
  <ellipse cx="1000" cy="315" rx="280" ry="180" fill="rgba(167,139,250,0.08)"/>

  <!-- Logo area -->
  <text x="80" y="110" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5" fill="white">⚡ JS<tspan fill="url(#accent)">Tools</tspan></text>

  <!-- Main headline -->
  <text x="80" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="62" font-weight="900" letter-spacing="-2" fill="white">Free browser-based</text>
  <text x="80" y="285" font-family="system-ui,-apple-system,sans-serif" font-size="62" font-weight="900" letter-spacing="-2">
    <tspan fill="url(#accent)">developer tools</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="345" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="rgba(255,255,255,0.5)" letter-spacing="-0.3">No sign-up · No server uploads · Open-source · Privacy-first</text>

  <!-- Card: Image Optimizer -->
  <rect x="80" y="400" width="490" height="170" rx="16" fill="url(#card1)" stroke="rgba(79,142,247,0.25)" stroke-width="1.5"/>
  <text x="110" y="445" font-family="system-ui,-apple-system,sans-serif" font-size="32">🖼️</text>
  <text x="158" y="448" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800" fill="white">Image Optimizer</text>
  <text x="110" y="478" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="rgba(255,255,255,0.45)">Compress JPEG · WebP · HEIC in your browser</text>
  <text x="110" y="504" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="rgba(79,142,247,0.9)">✓ Bulk processing  ✓ Watermark  ✓ Resize</text>
  <text x="110" y="528" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">image-optimizer.js-tools.org</text>

  <!-- Card: Snapcast -->
  <rect x="630" y="400" width="490" height="170" rx="16" fill="url(#card2)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5"/>
  <text x="660" y="445" font-family="system-ui,-apple-system,sans-serif" font-size="32">📸</text>
  <text x="708" y="448" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800" fill="white">Snapcast</text>
  <text x="660" y="478" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="rgba(255,255,255,0.45)">Real-time photo slideshow for live events</text>
  <text x="660" y="504" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="rgba(167,139,250,0.9)">✓ QR guest access  ✓ Live slideshow  ✓ Remote</text>
  <text x="660" y="528" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">snapcast.js-tools.org</text>

  <!-- Domain badge -->
  <rect x="80" y="358" width="160" height="30" rx="8" fill="rgba(79,142,247,0.15)" stroke="rgba(79,142,247,0.3)" stroke-width="1"/>
  <text x="160" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="rgba(79,142,247,0.9)" text-anchor="middle">js-tools.org</text>
</svg>
